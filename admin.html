<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administração | Portfólio Karina</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --card: #191f2b;
      --border: #30394a;
      --text: #f5f7fb;
      --muted: #aab4c5;
      --accent: #a7f3d0;
      --danger: #fca5a5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, sans-serif;
    }

    a { color: var(--accent); }

    .container {
      width: min(1000px, calc(100% - 32px));
      margin: auto;
    }

    header, .row, .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: clamp(2rem, 5vw, 3rem); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin: 20px 0;
    }

    .muted, .help { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .full { grid-column: 1 / -1; }

    input:not([type="checkbox"]),
    textarea {
      width: 100%;
      padding: 11px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    button.primary {
      background: var(--accent);
      color: #10211d;
      border-color: var(--accent);
    }

    button.danger { color: var(--danger); }
    button:disabled { opacity: .5; cursor: wait; }

    .actions { justify-content: flex-start; margin-top: 14px; }

    .status {
      min-height: 24px;
      color: var(--accent);
      overflow-wrap: anywhere;
    }

    .error { color: var(--danger); }
    .hidden { display: none !important; }
    .small { font-size: .85rem; }

    .notice {
      padding: 12px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      background: #a7f3d010;
    }

    .project {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .project h3 { margin-top: 0; }
    .project p { color: var(--muted); }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .card { padding: 16px; }
    }
  </style>
</head>
