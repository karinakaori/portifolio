```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administração | Portfólio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --card: #191f2b;
      --border: #30394a;
      --text: #f5f7fb;
      --muted: #aab4c5;
      --accent: #a7f3d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, sans-serif;
    }
    main { max-width: 900px; margin: auto; }
    a { color: var(--accent); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px; margin: 20px 0;
    }
    label { display: block; margin: 12px 0 5px; }
    input:not([type=checkbox]), textarea {
      display: block; width: 100%; padding: 11px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 90px; }
    button {
      padding: 10px 16px; margin: 12px 8px 0 0;
      border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; font: inherit; color: var(--text);
      background: transparent;
    }
    button.primary { background: var(--accent); color: #10211d; }
    .muted { color: var(--muted); }
    .status { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    .project {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin: 12px 0; overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <p><a href="index.html">← Voltar ao portfólio</a></p>
  <h1>Área administrativa</h1>
  <p class="muted">Entre para gerenciar seus projetos e consultar mensagens.</p>

  <section id="login-card" class="card">
    <h2>Entrar</h2>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username"
             required maxlength="254">
      <label for="password">Senha</label>
      <input id="password" type="password"
             autocomplete="current-password" required>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </section>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <section id="dashboard" class="hidden">
    <div class="card">
      <p id="user-info" class="muted"></p>
      <button id="logout">Sair</button>
    </div>

    <div class="card">
      <h2>Projetos</h2>
      <div id="projects-list"></div>
    </div>

    <div class="card">
      <h2 id="form-title">Adicionar projeto</h2>
      <form id="project-form">
        <input id="project-id" type="hidden">

        <label for="title">Título *</label>
        <input id="title" required maxlength="160">

        <label for="slug">Slug (identificador da URL) *</label>
        <input id="slug" required maxlength="180">

        <label for="summary">Resumo *</label>
        <textarea id="summary" required maxlength="500"></textarea>

        <label for="description">Descrição</label>
        <textarea id="description"></textarea>

        <label for="technologies">Tecnologias (separadas por vírgula)</label>
        <input id="technologies" placeholder="AWS, Python, SQL">

        <label for="project-url">URL do projeto</label>
        <input id="project-url" type="url" placeholder="https://...">

        <label for="repo-url">URL do repositório</label>
        <input id="repo-url" type="url" placeholder="https://github.com/...">

        <label for="image-url">URL da imagem</label>
        <input id="image-url" type="url" placeholder="https://...">

        <label>
          <input id="featured" type="checkbox">
          Destacar projeto
        </label>

        <label>
          <input id="published" type="checkbox" checked>
          Publicar projeto
        </label>

        <label for="display-order">Ordem de exibição</label>
        <input id="display-order" type="number" value="0">

        <button class="primary" type="submit">Salvar projeto</button>
        <button id="cancel-edit" type="button">Cancelar edição</button>
      </form>
    </div>

    <div class="card">
      <h2>Mensagens recebidas</h2>
      <div id="messages-list"></div>
    </div>
  </section>
</main>

<script type="module">
  import { createClient } from
    'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL =
    'https://qwnrwqzymktncxzdbxef.supabase.co';
  const SUPABASE_KEY =
    'sb_publishable_eLww2wpcrY0GqzkPPE1gXg_nkPcSvcm';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);

  let currentUser = null;
  let projects = [];

  function status(message, error = false) {
    $('status').textContent = message;
    $('status').style.color = error ? '#fca5a5' : '#a7f3d0';
  }

  function safeUrl(value) {
    if (!value) return null;
    const url = new URL(value);
    if (!['https:', 'http:'].includes(url.protocol)) {
      throw new Error('Use apenas URLs HTTP ou HTTPS.');
    }
    return url.href;
  }

  function clearForm() {
    $('project-form').reset();
    $('project-id').value = '';
    $('published').checked = true;
    $('display-order').value = '0';
    $('form-title').textContent = 'Adicionar projeto';
  }

  async function loadProjects() {
    const { data, error } = await supabase
      .from('portfolio_projects')
      .select('*')
      .or(`owner_id.is.null,owner_id.eq.${currentUser.id}`)
      .order('display_order');

    if (error) throw error;
    projects = data || [];

    const list = $('projects-list');
    list.replaceChildren();

    if (!projects.length) {
      list.textContent = 'Nenhum projeto encontrado.';
      return;
    }

    for (const project of projects) {
      const item = document.createElement('article');
      item.className = 'project';

      const heading = document.createElement('h3');
      heading.textContent = project.title;
      item.append(heading);

      const description = document.createElement('p');
      description.textContent =
        `${project.summary || ''} · ${project.published ? 'Publicado' : 'Rascunho'}`;
      item.append(description);

      const edit = document.createElement('button');
      edit.textContent = 'Editar';
      edit.addEventListener('click', () => editProject(project));
      item.append(edit);

      if (project.owner_id === currentUser.id) {
        const remove = document.createElement('button');
        remove.textContent = 'Excluir';
        remove.addEventListener('click', () => deleteProject(project));
        item.append(remove);
      }

      list.append(item);
    }
  }

  function editProject(p) {
    $('project-id').value = p.id;
    $('title').value = p.title || '';
    $('slug').value = p.slug || '';
    $('summary').value = p.summary || '';
    $('description').value = p.description || '';
    $('technologies').value = (p.technologies || []).join(', ');
    $('project-url').value = p.project_url || '';
    $('repo-url').value = p.repo_url || '';
    $('image-url').value = p.image_url || '';
    $('featured').checked = !!p.featured;
    $('published').checked = !!p.published;
    $('display-order').value = p.display_order ?? 0;
    $('form-title').textContent = 'Editar projeto';
    $('project-form').scrollIntoView({ behavior: 'smooth' });
  }

  async function deleteProject(p) {
    if (!confirm(`Excluir o projeto "${p.title}"?`)) return;

    status('Excluindo projeto...');
    const { error } = await supabase
      .from('portfolio_projects')
      .delete()
      .eq('id', p.id)
      .eq('owner_id', currentUser.id);

    if (error) return status(error.message, true);

    status('Projeto excluído.');
    await loadProjects();
  }

  $('project-form').addEventListener('submit', async event => {
    event.preventDefault();
    status('Salvando projeto...');

    try {
      const title = $('title').value.trim();
      const slug = $('slug').value.trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');

      const project = {
        title,
        slug,
        summary: $('summary').value.trim(),
        description: $('description').value.trim(),
        technologies: $('technologies').value
          .split(',').map(t => t.trim()).filter(Boolean),
        project_url: safeUrl($('project-url').value.trim()),
        repo_url: safeUrl($('repo-url').value.trim()),
        image_url: safeUrl($('image-url').value.trim()),
        featured: $('featured').checked,
        published: $('published').checked,
        display_order: Number($('display-order').value) || 0,
        owner_id: currentUser.id
      };

      const id = $('project-id').value;
      let result;

      if (id) {
        result = await supabase
          .from('portfolio_projects')
          .update(project)
          .eq('id', id);
      } else {
        result = await supabase
          .from('portfolio_projects')
          .insert(project);
      }

      if (result.error) throw result.error;

      clearForm();
      status('Projeto salvo com sucesso.');
      await loadProjects();
    } catch (error) {
      status(error.message || 'Não foi possível salvar.', true);
    }
  });

  $('cancel-edit').addEventListener('click', clearForm);

  async function loadMessages() {
    const { data, error } = await supabase
      .from('contact_messages')
      .select('id,name,email,subject,message,created_at')
      .order('created_at', { ascending: false });

    if (error) throw error;

    const list = $('messages-list');
    list.replaceChildren();

    if (!data?.length) {
      list.textContent = 'Nenhuma mensagem recebida.';
      return;
    }

    for (const msg of data) {
      const article = document.createElement('article');
      article.className = 'project';

      const heading = document.createElement('h3');
      heading.textContent = msg.subject || 'Mensagem de contato';

      const sender = document.createElement('p');
      sender.textContent = `${msg.name} · ${msg.email}`;

      const body = document.createElement('p');
      body.textContent = msg.message;

      const date = document.createElement('p');
      date.className = 'muted';
      date.textContent = new Date(msg.created_at).toLocaleString('pt-BR');

      article.append(heading, sender, body, date);
      list.append(article);
    }
  }

  async function showDashboard(user) {
    currentUser = user;

    const { data, error } = await supabase
      .from('portfolio_admins')
      .select('user_id')
      .eq('user_id', user.id)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      await supabase.auth.signOut();
      currentUser = null;
      throw new Error(
        'Seu usuário ainda não foi autorizado em portfolio_admins.'
      );
    }

    $('login-card').classList.add('hidden');
    $('dashboard').classList.remove('hidden');
    $('user-info').textContent = `Conectado: ${user.email}`;

    await loadProjects();
    await loadMessages();
    status('Login realizado. Painel carregado.');
  }

  $('login-form').addEventListener('submit', async event => {
    event.preventDefault();
    status('Verificando acesso...');

    const { data, error } = await supabase.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });

    if (error) return status(error.message, true);

    try {
      await showDashboard(data.user);
    } catch (err) {
      status(err.message || 'Não foi possível carregar o painel.', true);
    }
  });

  $('logout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    currentUser = null;
    $('dashboard').classList.add('hidden');
    $('login-card').classList.remove('hidden');
    $('password').value = '';
    status('Você saiu do painel.');
  });

  const { data: sessionData } = await supabase.auth.getSession();

  if (sessionData.session) {
    try {
      await showDashboard(sessionData.session.user);
    } catch (error) {
      status(error.message || 'Não foi possível carregar o painel.', true);
    }
  }
</script>
</body>
</html>
